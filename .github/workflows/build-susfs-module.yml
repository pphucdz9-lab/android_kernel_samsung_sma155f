name: Build SUSFS Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build SUSFS module
        run: |
          cd patches/susfs4ksu
          chmod +x build_ksu_module.sh
          ./build_ksu_module.sh
          echo "Module built successfully!"

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-module
          path: patches/susfs4ksu/susfs4ksu-module.zip
